<!DOCTYPE html>
<html lang="en">
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#141210">
  <meta name="description" content="kartikey srivastava — flutter developer shipping cross-platform apps for ios and android. selected work, experience and contact.">
  <meta name="author" content="Kartikey Srivastava">

  <!-- Link previews -->
  <meta property="og:type" content="website">
  <meta property="og:title" content="kartikey srivastava — flutter developer">
  <meta property="og:description" content="crafting apps that people love to use. selected work, experience and contact.">
  <meta property="og:image" content="icons/Icon-512.png">
  <meta name="twitter:card" content="summary">
  <meta name="twitter:title" content="kartikey srivastava — flutter developer">
  <meta name="twitter:description" content="crafting apps that people love to use.">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="kartikey">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>kartikey srivastava — flutter developer</title>
  <link rel="manifest" href="manifest.json">

  <style>
    /* The engine takes a moment to boot. The boot screen is set on whichever
       stock the reader's OS asks for, so there is no flash of the wrong
       edition before the app paints its own. A reader who has since chosen the
       other edition in the nav sees this for a frame at most — the app applies
       the saved choice on its first build. */
    :root {
      --paper: #F3F0E9;
      --ink: #15130F;
      --ink-faint: #8C857A;
      --rule: rgba(21, 19, 15, 0.14);
      --accent: #2438E0;
      --bloom: rgba(36, 56, 224, 0.07);
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --paper: #141210;
        --ink: #F2EEE4;
        --ink-faint: #7A7369;
        --rule: rgba(242, 238, 228, 0.16);
        --accent: #7C8CFF;
        --bloom: rgba(124, 140, 255, 0.10);
      }
    }
    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      background-color: var(--paper);
    }
    /* Only while the engine boots — removed on the first frame so the app owns
       scrolling from then on. */
    body.booting { overflow: hidden; }
    #boot {
      position: fixed;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 20px;
      background:
        radial-gradient(60% 50% at 50% 18%, var(--bloom), transparent 70%),
        var(--paper);
      font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace;
      color: var(--ink-faint);
      transition: opacity 400ms ease;
      z-index: 2;
    }
    #boot.done { opacity: 0; pointer-events: none; }
    #boot .name {
      font-size: 12px;
      font-weight: 600;
      letter-spacing: 0.22em;
      text-transform: uppercase;
      color: var(--ink);
    }
    #boot .track {
      width: 148px;
      height: 2px;
      background: var(--rule);
      overflow: hidden;
    }
    #boot .track span {
      display: block;
      width: 40%;
      height: 100%;
      background: var(--accent);
      animation: slide 1.15s ease-in-out infinite;
    }
    @keyframes slide {
      0%   { transform: translateX(-100%); }
      100% { transform: translateX(250%); }
    }
    @media (prefers-reduced-motion: reduce) {
      #boot .track span { animation: none; width: 100%; }
    }
  </style>
</head>
<body class="booting">
  <div id="boot">
    <div class="name">Kartikey Srivastava</div>
    <div class="track"><span></span></div>
  </div>

  <script>
    window.addEventListener('flutter-first-frame', function () {
      document.body.classList.remove('booting');
      var boot = document.getElementById('boot');
      if (!boot) return;
      boot.classList.add('done');
      setTimeout(function () { boot.remove(); }, 450);
    });
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
