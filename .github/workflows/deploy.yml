name: Deploy to GitHub Pages

# Build the Flutter web app and publish it to GitHub Pages on every push to
# main. No gh-pages branch needed — the built output is deployed directly.
on:
  push:
    branches: [main]
  workflow_dispatch: # allows manual "Run workflow" from the Actions tab

# Permissions required by actions/deploy-pages
permissions:
  contents: read
  pages: write
  id-token: write

# Only one deploy at a time; a newer push cancels an in-flight run
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          # Matches the SDK the app is developed and tested against.
          flutter-version: '3.47.0'
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Build web
        run: |
          # A user site (<owner>.github.io) is served from the domain root;
          # every other repo is served from /<repo>/. Deriving the base href
          # from the repository name means renaming the repo is all it takes
          # to move the site — no workflow edit, and no chance of the href and
          # the real path disagreeing, which serves a blank page.
          repo="${GITHUB_REPOSITORY#*/}"
          owner="${GITHUB_REPOSITORY%/*}"
          if [ "$(echo "$repo" | tr '[:upper:]' '[:lower:]')" \
             = "$(echo "$owner" | tr '[:upper:]' '[:lower:]').github.io" ]; then
            base="/"
          else
            base="/$repo/"
          fi
          echo "Building with base href $base"
          flutter build web --release --base-href "$base"

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: build/web

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
